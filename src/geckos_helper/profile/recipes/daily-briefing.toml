name = "Daily briefing"
description = "Your day at a glance: schedule, what's due, weather, goals"
daily_at = ["08:00"]
model = "sonnet"
output = "both"
enabled = true
prompt = """Write my morning briefing for today. Sections (skip any that are empty):
1. **Today**: my schedule from all calendars, with times and places. Flag tests,
   exams and deadlines.
2. **Due soon**: anything due in the next 3 days from my calendars, Obsidian tasks
   (obsidian_open_tasks) and my to-do list.
3. **Weather**: today's weather, especially rain and temperature when I'm likely out.
4. **Projects**: the next step for each active project or goal (project_next_actions).
5. **Suggestion**: one concrete thing to focus on today.
Keep it short and scannable. If there are clear actions for today that aren't already
on my to-do list, suggest up to 3 to-dos (gecko-todos block)."""
